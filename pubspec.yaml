name: swe_flutter_template
description: SWE Flutter App Template
version: 1.0.0+1
workspace:
  - packages/swe_design_system
  - packages/widgetbook


environment:
  sdk: 3.13.7
  flutter: 3.47.8

dependencies:
  bloc: 9.2.1
  firebase_analytics: 13.0.1
  firebase_auth: 7.0.1
  firebase_core: 5.1.0
  firebase_crashlytics: 6.0.1
  firebase_messaging: 17.0.1
  firebase_performance: 0.12.1
  firebase_remote_config: 7.0.1
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3
  material_ui: 1.10.0
  swe_design_system: 0.1.0+1

dev_dependencies:
  bloc_lint: 0.4.3
  bloc_test: 10.0.0
  bloc_tools: 0.1.0-dev.25
  flutter_test:
    sdk: flutter
  mocktail: 1.0.5
  very_good_analysis: 11.0.0

flutter:
  generate: true
  uses-material-design: true
