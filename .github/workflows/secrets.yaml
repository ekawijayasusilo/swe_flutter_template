name: secrets

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 2 * * 1" # weekly full-history scan, so new default rules also run on old commits

permissions: {}

env:
  # renovate: datasource=github-releases depName=betterleaks/betterleaks
  BETTERLEAKS_VERSION: "1.10.1"

# Generic secret scanning (private keys, tokens, passwords), on top of GitHub secret scanning.
# PRs scan only their own commits; main and the weekly run scan the whole history.
# Never add --validate: it would send found secrets to provider APIs.
jobs:
  betterleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Betterleaks
        run: |
          base="https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}"
          archive="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/checksums.txt"
          sha256sum -c --ignore-missing --strict checksums.txt
          grep -q " ${archive}\$" checksums.txt # fail if the archive isn't listed at all
          tar -xzf "$archive" betterleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan PR commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: betterleaks git --config .betterleaks.toml --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}" .

      - name: Scan full history
        if: github.event_name != 'pull_request'
        run: betterleaks git --config .betterleaks.toml --redact --verbose .
