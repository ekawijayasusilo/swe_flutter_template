name: flutterfire_ios

# Manual only: fork PRs can't trigger it, so the service account secret stays private.
on: workflow_dispatch

jobs:
  configure:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the result branch
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install Firebase CLI and FlutterFire CLI
        run: |
          npm install -g firebase-tools@15.28.1
          dart pub global activate flutterfire_cli 1.4.1
          echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"
          # FlutterFire edits the Xcode project through this Ruby gem.
          ruby -e "require 'xcodeproj'" 2>/dev/null || gem install xcodeproj

      - name: Write service account key
        env:
          SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
        run: |
          test -n "$SA_JSON" || { echo "::error::Secret FIREBASE_SA_JSON is not set"; exit 1; }
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"

      - name: Configure iOS
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ runner.temp }}/sa.json
        run: bash scripts/flutterfire-ios-one-time-setup.sh

      - name: Push result branch
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes; iOS config already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="chore/flutterfire-ios-${GITHUB_RUN_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "chore: configure firebase for ios"
          git push origin "$branch"
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${GITHUB_REF_NAME}...${branch}?expand=1"
          echo "Review and open a draft PR: $url" >> "$GITHUB_STEP_SUMMARY"
