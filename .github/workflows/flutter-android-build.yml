name: flutter-android-build

# Temporary: builds a debug APK so Android build changes (Flutter SDK, AGP, Kotlin, Gradle plugins) get checked in CI.
# To be replaced by a reusable workflow from proto_codecare. Not a required check: it only runs when these paths change.
on:
  pull_request:
    paths:
      - pubspec.yaml
      - pubspec.lock
      - android/**
      - .github/workflows/flutter-android-build.yml
  workflow_dispatch:

concurrency:
  group: flutter-android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - run: flutter pub get --enforce-lockfile

      # Debug build: the release build needs the signing keystore, which CI doesn't have.
      - run: flutter build apk --debug --flavor development -t lib/main_development.dart
