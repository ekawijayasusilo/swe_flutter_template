name: swe_flutter_template

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  semantic-pull-request:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v2
    with:
      # Default conventional types, plus "vulnerability" used by Dependabot security PRs (.github/dependabot.yaml).
      types: |
        feat
        fix
        docs
        style
        refactor
        perf
        test
        build
        ci
        chore
        revert
        vulnerability

  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v2
    with:
      flutter_version_file: pubspec.yaml
      run_bloc_lint: true

  build-design-system:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v2
    with:
      flutter_version_file: pubspec.yaml
      working_directory: packages/swe_design_system

  # Widgetbook is an app without tests, so flutter_package.yml (100% coverage gate) doesn't fit.
  build-widgetbook:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/widgetbook
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - run: flutter pub get

      - run: dart format --set-exit-if-changed lib

      - run: flutter analyze lib

      - name: Verify generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code
          test -z "$(git status --porcelain)"

  # The workspace has a single root pubspec.lock. Renovate may bump a member's pubspec.yaml
  # without updating it, and plain `pub get` would silently re-resolve, so fail on drift instead.
  lockfile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - run: flutter pub get --enforce-lockfile

  spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@v2
    with:
      includes: |
        **/*.md
      modified_files_only: false
